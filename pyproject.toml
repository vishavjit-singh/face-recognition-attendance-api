[project]
name = "face-recognition-attendance-api"
version = "1.0.0"
description = "Face-recognition attendance service: YuNet detection, SFace embeddings on ONNX Runtime, quality gates, open-set matching, SQLite and an ASGI API."
authors = [{ name = "Vishavjit Singh Saini" }]
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
